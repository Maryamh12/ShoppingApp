{% extends 'base.html' %}
{% block content %}

<div class="registerContainer">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-header text-center py-3">
            <img src="https://cdn-icons-png.flaticon.com/128/11339/11339542.png" style="width:36px; margin-bottom:6px;" alt="logo" />
            <h4 class="mb-0">Create account</h4>
            <small class="text-muted">Join us and start shopping</small>
          </div>
          <div class="card-body p-4">
            <form method="post" action="/register" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                  placeholder="Choose a username" required autocomplete="username" />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email"
                  placeholder="you@example.com" required autocomplete="email" />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                  placeholder="Minimum 8 characters" required autocomplete="new-password" />
              </div>
              <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password"
                  name="confirm_password" placeholder="Repeat your password"
                  required autocomplete="new-password" />
              </div>
              <div class="d-grid mt-3">
                <button type="submit" class="btn-accent justify-content-center">
                  <i class="fa fa-user-plus"></i> Create Account
                </button>
              </div>
            </form>
            <hr class="my-3" />
            <p class="text-center text-muted mb-0" style="font-size:.85rem;">
              Already have an account?
              <a href="{{ url_for('login') }}" class="text-accent text-decoration-none fw-600">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
