{% extends 'base.html' %}
{% block content %}

<div class="loginContainer">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-header text-center py-3">
            <img src="https://cdn-icons-png.flaticon.com/128/11339/11339542.png" style="width:36px; margin-bottom:6px;" alt="logo" />
            <h4 class="mb-0">Welcome back</h4>
            <small class="text-muted">Sign in to continue shopping</small>
          </div>
          <div class="card-body p-4">
            <form method="post" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                  placeholder="Your username" required autocomplete="username" />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                  placeholder="Your password" required autocomplete="current-password" />
              </div>
              <div class="d-grid mt-3">
                <button type="submit" class="btn-accent justify-content-center">
                  <i class="fa fa-sign-in-alt"></i> Sign In
                </button>
              </div>
            </form>
            <hr class="my-3" />
            <p class="text-center text-muted mb-0" style="font-size:.85rem;">
              Don't have an account?
              <a href="{{ url_for('register') }}" class="text-accent text-decoration-none fw-600">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
